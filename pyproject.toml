[project]
name = "databricks_lakebase"
version = "0.0.1"
authors = [{ name = "florian.fr@protonmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Any dependencies for jobs and pipelines in this project can be added here
    # See also https://docs.databricks.com/dev-tools/bundles/library-dependencies
    #
    # LIMITATION: for pipelines, dependencies are cached during development;
    # add dependencies to the 'environment' section of your pipeline.yml file instead
    #
    # Used by scripts/check_lakebase.py and scripts/setup_reverse_sync_demo.py
    # to connect to Lakebase Postgres directly from a local machine.
    "databricks-sdk>=0.106.0",
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-connect>=18.3,<18.4",
]

[project.scripts]
main = "databricks_lakebase.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
