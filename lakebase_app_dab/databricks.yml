bundle:
  name: lakebase_bakehouse_viewer

variables:
  lakebase_project_id:
    description: Lakebase project id from ../lakebase_setup_dab.
    default: lakebase-bakehouse-demo
  lakebase_branch:
    description: Lakebase branch.
    default: production
  lakebase_database:
    description: Resource id of the synced database (Postgres name databricks_postgres).
    default: databricks-postgres

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com
