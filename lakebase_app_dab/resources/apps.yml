resources:
  apps:
    bakehouse_viewer:
      name: bakehouse-lakebase-viewer
      description: Reads synced bakehouse tables from Lakebase and writes comments to app_db.
      source_code_path: ../src/app
      # Synced database must stay first: PG* env vars are only injected for it.
      resources:
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}
            database: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}/databases/${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: app-db
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}
            database: ${resources.postgres_databases.app_db.id}
            permission: CAN_CONNECT_AND_CREATE
      permissions:
        - group_name: group_etl
          level: CAN_USE
