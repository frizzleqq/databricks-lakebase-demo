resources:
  # The app's own database, inside ../lakebase_setup_dab's project.
  postgres_databases:
    app_db:
      parent: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}
      database_id: app-db
      postgres_database: app_db
      # Declared in ../lakebase_setup_dab.
      role: projects/${var.lakebase_project_id}/branches/${var.lakebase_branch}/roles/lakebase-owner
