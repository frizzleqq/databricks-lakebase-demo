resources:
  schemas:
    sync_bakehouse:
      catalog_name: ${var.catalog}
      name: ${var.schema}
      comment: Delta source tables copied from samples.bakehouse, synced into Lakebase.
      properties:
        project: lakebase_demo
      # Showcase grant: read access to the Delta-side schema.
      grants:
        - principal: group_etl
          privileges:
            - USE_SCHEMA
            - SELECT
