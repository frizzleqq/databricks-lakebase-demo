resources:
  postgres_projects:
    bakehouse_demo:
      project_id: ${var.lakebase_project_id}
      display_name: "Lakebase Bakehouse Sync Demo"
      pg_version: 17
      custom_tags:
        - key: project
          value: lakebase_demo
      # Showcase grant (workspace ACL; only CAN_USE/CAN_MANAGE exist).
      permissions:
        - group_name: group_etl
          level: CAN_USE

  postgres_branches:
    production_branch:
      branch_id: production
      parent: projects/${resources.postgres_projects.bakehouse_demo.project_id}
      replace_existing: true

  postgres_endpoints:
    primary_endpoint:
      endpoint_id: primary
      parent: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/${resources.postgres_branches.production_branch.branch_id}
      endpoint_type: ENDPOINT_TYPE_READ_WRITE
      autoscaling_limit_min_cu: 0.5
      autoscaling_limit_max_cu: 0.5
      replace_existing: true

  # Explicit database owner, instead of the deployer's personal role.
  postgres_roles:
    lakebase_owner:
      parent: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/${resources.postgres_branches.production_branch.branch_id}
      role_id: lakebase-owner
      postgres_role: lakebase_owner

  postgres_databases:
    databricks_postgres:
      parent: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/${resources.postgres_branches.production_branch.branch_id}
      database_id: databricks-postgres
      # Must stay the default: Lakehouse Sync only supports this database.
      postgres_database: databricks_postgres
      role: ${resources.postgres_roles.lakebase_owner.id}
      replace_existing: true  # adopt the branch's default database

  postgres_catalogs:
    bakehouse_catalog:
      catalog_id: ${var.lakebase_project_id}
      postgres_database: ${resources.postgres_databases.databricks_postgres.postgres_database}
      branch: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/production
      # No-op, but changing it recreates the catalog and synced tables.
      create_database_if_missing: true

  # source_table_full_name reads catalog/schema from the initial_seed job run, so
  # each synced table is created only after the seed run (see jobs.yml).
  postgres_synced_tables:
    sales_franchises:
      synced_table_id: ${resources.postgres_catalogs.bakehouse_catalog.catalog_id}.${var.schema}.sales_franchises
      source_table_full_name: ${resources.job_runs.initial_seed.job_parameters.catalog}.${resources.job_runs.initial_seed.job_parameters.schema}.sales_franchises
      branch: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/production
      postgres_database: databricks_postgres
      primary_key_columns: [franchiseID]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${workspace.current_user.short_name}

    sales_customers:
      synced_table_id: ${resources.postgres_catalogs.bakehouse_catalog.catalog_id}.${var.schema}.sales_customers
      source_table_full_name: ${resources.job_runs.initial_seed.job_parameters.catalog}.${resources.job_runs.initial_seed.job_parameters.schema}.sales_customers
      branch: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/production
      postgres_database: databricks_postgres
      primary_key_columns: [customerID]
      scheduling_policy: TRIGGERED
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${workspace.current_user.short_name}

    sales_transactions:
      synced_table_id: ${resources.postgres_catalogs.bakehouse_catalog.catalog_id}.${var.schema}.sales_transactions
      source_table_full_name: ${resources.job_runs.initial_seed.job_parameters.catalog}.${resources.job_runs.initial_seed.job_parameters.schema}.sales_transactions
      branch: projects/${resources.postgres_projects.bakehouse_demo.project_id}/branches/production
      postgres_database: databricks_postgres
      primary_key_columns: [transactionID]
      scheduling_policy: TRIGGERED
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ${var.catalog}
        storage_schema: ${workspace.current_user.short_name}
