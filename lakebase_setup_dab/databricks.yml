bundle:
  name: databricks_lakebase
  uuid: cadd75b5-faa7-4a51-878a-59fdebc9ff08

include:
  - resources/*.yml
  # Your workspace (git-ignored). See ../databricks.local.yml.example.
  - ../databricks.local.yml

variables:
  catalog:
    description: The UC catalog holding the Delta source tables (copied from samples.bakehouse)
    default: lake_dev # override in ../databricks.local.yml
  schema:
    description: The UC schema (and matching Postgres schema) holding the synced tables
  lakebase_project_id:
    description: Lakebase Autoscaling project id for the sync_bakehouse demo

targets:
  # Deliberately prod only: there is one Lakebase project, and environments are
  # branches of it (see ../lakebase_app_dab's dev target).
  prod:
    mode: production
    default: true
    workspace:
      root_path: /Workspace/bundle/${bundle.name}/${bundle.target}
    variables:
      schema: sync_bakehouse
      lakebase_project_id: lakebase-bakehouse-demo
