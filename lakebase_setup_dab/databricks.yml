bundle:
  name: databricks_lakebase
  uuid: cadd75b5-faa7-4a51-878a-59fdebc9ff08

include:
  - resources/*.yml

experimental:
  # Keep "sync_bakehouse" unprefixed in dev mode; it must match the Postgres schema.
  skip_name_prefix_for_schema: true

variables:
  catalog:
    description: The UC catalog holding the Delta source tables (copied from samples.bakehouse)
  schema:
    description: The UC schema (and matching Postgres schema) holding the synced tables
  lakebase_project_id:
    description: Lakebase Autoscaling project id for the sync_bakehouse demo

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com
    variables:
      catalog: lake_dev
      schema: sync_bakehouse
      lakebase_project_id: lakebase-bakehouse-demo
