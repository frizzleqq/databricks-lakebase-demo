# This is a Declarative Automation Bundle definition for databricks_lakebase.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_lakebase
  uuid: cadd75b5-faa7-4a51-878a-59fdebc9ff08

include:
  - resources/*.yml

experimental:
  # The schema name must stay exactly "sync_bakehouse" (it's referenced
  # as both the UC schema and the matching Postgres schema) -- without this,
  # `mode: development` below would silently prefix it (e.g. "dev_user_sync_bakehouse").
  skip_name_prefix_for_schema: true

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The UC catalog holding the Delta source tables (copied from samples.bakehouse)
  schema:
    description: The UC schema (and matching Postgres schema) holding the synced tables
  lakebase_project_id:
    description: Lakebase Autoscaling project id for the sync_bakehouse demo

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com
    variables:
      catalog: lake_dev
      schema: sync_bakehouse
      lakebase_project_id: lakebase-bakehouse-demo
  prod:
    mode: production
    workspace:
      host: https://dbc-ea4bb8e5-6935.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/florian.fr@protonmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/florian.fr@protonmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: lake_dev
      schema: sync_bakehouse
      lakebase_project_id: lakebase-bakehouse-prod
    permissions:
      - user_name: florian.fr@protonmail.com
        level: CAN_MANAGE
